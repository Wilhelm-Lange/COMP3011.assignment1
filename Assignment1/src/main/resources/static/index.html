<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Speech to Text</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<main>
		<h1>Speech to Text</h1>
		<p class="hint">Press record, say something, then press stop.</p>

		<button id="recordButton" type="button">Start recording</button>

		<!-- aria-live so a screen reader announces the state changing -->
		<p id="status" class="status" role="status" aria-live="polite">Ready</p>

		<section>
			<h2>Transcript</h2>
			<p id="transcript" class="transcript">Nothing yet.</p>
		</section>
	</main>

	<script src="app.js"></script>
</body>
</html>
