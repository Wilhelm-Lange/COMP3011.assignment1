spring.application.name=Assignment1

# yaml wants timestamps as strings not epoch numbers.
# boot 4 uses jackson 3 so this property moved, the old spring.jackson.serialization one does nothing
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# let in-flight requests finish instead of getting cut off
server.shutdown=graceful

# openai speech to text. the key comes from the OPENAI_API_KEY environment variable,
# which is what TITAN sets. never put the actual key in here.
openai.base-url=https://api.openai.com/v1
openai.model=gpt-4o-mini-transcribe
openai.api-key=${OPENAI_API_KEY:}

# don't wait forever if openai is slow or unreachable
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=30s

# default max upload is only 1MB which isn't enough for a recording.
# openai's own limit is 25MB so match that.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# every request runs on a virtual thread instead of a pooled platform thread.
# the stt call blocks while it waits for openai, and with platform threads that
# would tie up one of the ~200 tomcat threads for the whole call. virtual threads
# are cheap so a blocked one doesn't stop other requests being handled.
# needs java 21+, this project is on 25.
spring.threads.virtual.enabled=true
